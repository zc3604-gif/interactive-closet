<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Closet</title>
  </head>
  <body>
    <div id="ui">
      <p class="label">Move the mouse over clothes to press the fabric.</p>
      <p class="hint">
        Only the clothes swing. The rack and hangers stay put.
        Drop your closet as <code>.glb</code> or <code>.obj</code>, or use Load closet.
      </p>
      <label class="load">
        Load closet
        <input id="file" type="file" accept=".glb,.gltf,.obj,.fbx,.mtl,.png,.jpg,.jpeg,.webp" multiple />
      </label>
    </div>
    <div id="drop-overlay">Drop closet.glb or closet.obj to load it</div>
    <canvas id="c"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
