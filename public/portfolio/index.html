<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zihan — Portfolio</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="chrome">
      <p class="path">Zihan <span>/ portfolio</span></p>
      <p class="help">Edit the functions to change the background. Drag a module to rearrange it.</p>
    </header>
    <aside id="stage">
      <p class="stage-label">functions <span>/ live</span></p>
      <textarea id="code" class="code" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off">const ZOOM = 1.8;
const SPEED = 0.35;
const CONTRAST = 1.4;

precision highp float;

uniform vec2 uResolution;
uniform vec2 uMouse;
uniform float uTime;
uniform float uZoom;
uniform float uContrast;

vec2 multiplyComplex(vec2 a, vec2 b) {
  return vec2(
    a.x * b.x - a.y * b.y,
    a.x * b.y + a.y * b.x
  );
}

vec2 divideComplex(vec2 a, vec2 b) {
  float denominator = max(dot(b, b), 0.00001);

  return vec2(
    a.x * b.x + a.y * b.y,
    a.y * b.x - a.x * b.y
  ) / denominator;
}

void main() {
  vec2 z = (
    2.0 * gl_FragCoord.xy - uResolution
  ) / min(uResolution.x, uResolution.y);

  z *= uZoom;

  float angle = 0.35;
  z = mat2(
    cos(angle), -sin(angle),
    sin(angle),  cos(angle)
  ) * z;

  vec2 a = vec2(
    -0.45 + 0.12 * sin(uTime),
     0.65
  );

  vec2 b = vec2(
     0.25,
    -0.65 + 0.10 * cos(uTime)
  );

  vec2 c = vec2(
     0.25 + uMouse.x * 0.55,
     0.25 + uMouse.y * 0.55
  );

  vec2 numerator = multiplyComplex(z - a, z - b);
  vec2 w = divideComplex(numerator, z - c);

  float phase = atan(w.y, w.x);
  float magnitude = length(w);

  float bend = 0.45 * sin(
    1.5 * log(1.0 + magnitude)
  );

  float light = 0.5 + 0.5 * cos(
    phase + bend + 0.3 * sin(uTime * 0.5)
  );

  light = clamp(
    (light - 0.5) * uContrast + 0.5,
    0.0,
    1.0
  );

  vec3 shadow = vec3(0.025, 0.020, 0.055);
  vec3 silver = vec3(0.56, 0.63, 0.70);
  vec3 highlight = vec3(0.88, 1.0, 1.0);

  vec3 color = mix(
    shadow,
    silver,
    smoothstep(0.0, 0.75, light)
  );

  color = mix(
    color,
    highlight,
    smoothstep(0.65, 1.0, light)
  );

  gl_FragColor = vec4(color, 1.0);
}</textarea>
      <p id="code-error" class="code-error" hidden></p>
    </aside>
    <div id="viewport" tabindex="0">
      <canvas id="art"></canvas>
      <div id="grid"></div>
      <div id="axes" aria-hidden="true">
        <div class="axis axis-x"></div>
        <div class="axis axis-y"></div>
        <svg id="axis-ticks"></svg>
        <span class="axis-label axis-label-x">x</span>
        <span class="axis-label axis-label-y">y</span>
      </div>
      <div id="world"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
