<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zihan — Portfolio</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="chrome">
      <p class="path">Zihan <span>/ portfolio</span></p>
      <p class="help">Scroll up to zoom in. Shift-scroll, or scroll sideways, to move left and right.</p>
    </header>
    <div id="viewport" tabindex="0">
      <div id="grid"></div>
      <div id="axes" aria-hidden="true">
        <div class="axis axis-x"></div>
        <div class="axis axis-y"></div>
        <svg id="axis-ticks"></svg>
        <span class="axis-label axis-label-x">x</span>
        <span class="axis-label axis-label-y">y</span>
      </div>
      <div id="world"></div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
